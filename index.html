<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amazon Gift Card</title>
    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at top, #1e1b2e 0%, #0c0a14 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: rgba(28, 23, 46, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 204, 0, 0.25);
            border-radius: 24px;
            max-width: 380px;
            width: 100%;
            padding: 30px 20px 24px;
            text-align: center;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(46, 204, 113, 0.15);
            border: 1px solid #2ecc71;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: #2ecc71;
            font-weight: 700;
            margin-bottom: 16px;
        }

        h2 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #fff2a3, #ffb834);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 13px;
            color: #a49bc7;
            line-height: 1.5;
            margin-bottom: 22px;
        }

        .voucher-box {
            background: linear-gradient(135deg, #f3a826 0%, #d48310 100%);
            border-radius: 16px;
            padding: 20px 16px;
            margin-bottom: 24px;
            color: #261600;
            box-shadow: 0 8px 24px rgba(212, 131, 16, 0.35);
        }

        .voucher-tag {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #4b3003;
            text-transform: uppercase;
        }

        .voucher-amount {
            font-size: 42px;
            font-weight: 900;
            margin-top: 4px;
        }

        .claim-btn {
            background: linear-gradient(135deg, #00b074 0%, #00875a 100%);
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 176, 116, 0.35);
            transition: all 0.2s ease;
        }

        .claim-btn:active {
            transform: scale(0.98);
        }

        .footer-text {
            font-size: 11.5px;
            color: #7b719c;
            margin-top: 18px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="badge">✅ Verification Complete</div>
    <h2>AMAZON GIFT CARD</h2>
    <p class="subtitle">Aapka reward successfully unlock ho chuka hai. Niche click karke turant claim karein.</p>

    <div class="voucher-box">
        <div class="voucher-tag">GIFT CARD VALUE</div>
        <div class="voucher-amount">₹10</div>
    </div>

    <button class="claim-btn" onclick="claimReward()">
        🎁 CLAIM ON ZINGOY
    </button>

    <div class="footer-text">Instant Voucher Activation • Secure Delivery</div>
</div>

<script>
    // Aapka Zingoy Affiliate Link
    const ZINGOY_URL = "https://zingoy.cuelinks.com/?ref=RWE6GD6";

    // Telegram Mini App Ready & Expand to Full Screen
    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }

    function claimReward() {
        // Telegram Mini App se external link open karne ka safe tareeqa
        if (window.Telegram?.WebApp?.openLink) {
            window.Telegram.WebApp.openLink(ZINGOY_URL);
        } else {
            window.location.href = ZINGOY_URL;
        }
    }
</script>

</body>
</html>
