<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amazon Gift Card</title>
    <!-- Telegram Mini App Official SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0d0b14;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .loader {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 204, 0, 0.2);
            border-top-color: #ffd452;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h3 {
            font-size: 18px;
            font-weight: 700;
            color: #ffd452;
            margin-bottom: 6px;
        }
        p {
            font-size: 13px;
            color: #8f85aa;
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <h3>Unlocking Reward...</h3>
    <p>Please wait, redirecting to Zingoy offer...</p>

<script>
    const CLAIM_URL = "https://zingoy.cuelinks.com/?ref=RWE6GD6";

    // Telegram Mini App Expand
    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }

    // Bina koi button dikhaye turant direct redirect
    window.location.replace(CLAIM_URL);
</script>

</body>
</html>
