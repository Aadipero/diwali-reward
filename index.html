<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diwali Special Reward</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0d0a1a;
            color: #ffffff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            box-sizing: border-box;
        }
        .container {
            background: #17122b;
            border-radius: 20px;
            padding: 24px 20px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid #2d2454;
        }
        .reward-card {
            background: linear-gradient(135deg, #d49520, #e6b33a);
            color: #000;
            border-radius: 12px;
            padding: 16px;
            margin: 15px 0;
            font-weight: bold;
        }
        .reward-card h1 { margin: 5px 0; font-size: 32px; }
        .reward-title { font-size: 11px; letter-spacing: 1px; color: #422f00; }
        .btn-link {
            display: block;
            background: #231b40;
            color: #ffcc00;
            text-decoration: none;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            font-weight: 600;
            border: 1px solid #48387d;
        }
        .btn-link.visited {
            background: #19382b;
            border-color: #27ae60;
            color: #2ecc71;
        }
        .status-msg {
            color: #2ecc71;
            font-size: 13px;
            margin: 12px 0 6px;
            display: none;
        }
        .claim-btn {
            background: #00875a;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .claim-btn:disabled {
            background: #2b3d36;
            color: #8fa69c;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <div style="font-size: 28px;">🪔 ✨ 🎆</div>
    <h2 style="color: #ffbe26; margin: 8px 0;">DIWALI SPECIAL OFFER</h2>
    <p style="font-size: 13px; color: #9c97b8; margin: 0 0 15px;">Happy Diwali! 🪔<br>Celebrate the festival of lights with our special reward offer.</p>

    <div class="reward-card">
        <div class="reward-title">FESTIVE REWARD</div>
        <h1>₹10 - ₹99</h1>
    </div>

    <!-- Replace with your channel invite links -->
    <a href="https://t.me/YOUR_CHANNEL_1_LINK" target="_blank" class="btn-link" id="ch1" onclick="markLink('ch1')">
        📢 Join Channel 1
    </a>

    <a href="https://t.me/YOUR_CHANNEL_2_LINK" target="_blank" class="btn-link" id="ch2" onclick="markLink('ch2')">
        📢 Join Channel 2
    </a>

    <p class="status-msg" id="statusMsg">Both links opened! Click claim to verify.</p>

    <button class="claim-btn" id="claimBtn" onclick="verifyMembership()">
        🎁 CLAIM REWARD
    </button>
</div>

<script>
    // Replace with your backend server URL (Render, Koyeb, VPS, or Railway)
    const BACKEND_API_URL = "https://YOUR-BACKEND-SERVER.com"; 

    // Retrieve userId from Telegram WebApp or URL query param (?userId=xxxx)
    const urlParams = new URLSearchParams(window.location.search);
    const userId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id || urlParams.get('userId');

    function markLink(id) {
        localStorage.setItem(id, 'true');
        checkBothVisited();
    }

    function checkBothVisited() {
        const v1 = localStorage.getItem('ch1') === 'true';
        const v2 = localStorage.getItem('ch2') === 'true';

        if (v1 && document.getElementById('ch1')) {
            document.getElementById('ch1').classList.add('visited');
            document.getElementById('ch1').innerText = "✅ Channel 1 Opened";
        }
        if (v2 && document.getElementById('ch2')) {
            document.getElementById('ch2').classList.add('visited');
            document.getElementById('ch2').innerText = "✅ Channel 2 Opened";
        }
        if (v1 && v2) {
            document.getElementById('statusMsg').style.display = 'block';
        }
    }

    window.onload = checkBothVisited;

    async function verifyMembership() {
        const claimBtn = document.getElementById('claimBtn');
        claimBtn.innerText = "🎁 VERIFYING MEMBERSHIP...";
        claimBtn.disabled = true;

        // Agar user direct browser se aaya aur userId nahi mili
        if (!userId) {
            alert("Bot verification ID nahi mili! Kripya Telegram Bot ke andar diye gaye button se open karein.");
            resetBtn();
            return;
        }

        try {
            const res = await fetch(`${BACKEND_API_URL}/verify?user_id=${userId}`);
            const data = await res.json();

            if (data.status === "success") {
                alert("🎉 Verification successful! Aapka reward claim ho gaya.");
                // Redirect user back to bot or success page
                window.location.href = `https://t.me/YOUR_BOT_USERNAME?start=claimed_${userId}`;
            } else {
                alert("Aapne dono channels join nahi kiye! Kripya pehle dono channel join karein (ya request send karein) fir dobara Claim dabayein.");
                resetBtn();
            }
        } catch (err) {
            console.error(err);
            alert("Verification server se connect nahi ho paya. Dobara try karein!");
            resetBtn();
        }
    }

    function resetBtn() {
        const claimBtn = document.getElementById('claimBtn');
        claimBtn.innerText = "🎁 CLAIM REWARD";
        claimBtn.disabled = false;
    }
</script>

</body>
</html>
